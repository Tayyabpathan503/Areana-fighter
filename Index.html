<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Fighter</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 12px 0;
  font-size: 28px;
}

.health-area {
  width: 95%;
  max-width: 850px;
  margin: auto;
  display: flex;
  gap: 12px;
}

.bar {
  flex: 1;
  height: 25px;
  background: #333;
  border: 2px solid white;
  border-radius: 8px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 100%;
  transition: width .25s;
}

#playerHealth {
  background: #20d060;
}

#enemyHealth {
  background: #e53935;
}

.arena {
  position: relative;
  width: 95%;
  max-width: 850px;
  height: 430px;
  margin: 15px auto;
  overflow: hidden;
  border: 4px solid #777;
  border-radius: 15px;
  background:
    linear-gradient(#182848, #4b6cb7);
}

.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 70px;
  background: #222;
  border-top: 5px solid #555;
}

.fighter {
  position: absolute;
  bottom: 70px;
  width: 55px;
  height: 95px;
  border-radius: 15px 15px 8px 8px;
  transition: left .08s, right .08s;
}

#player {
  left: 80px;
  background: #2196f3;
}

#enemy {
  right: 80px;
  background: #ff3b30;
}

.fighter::before {
  content: "";
  position: absolute;
  width: 38px;
  height: 38px;
  background: #ffd1a4;
  border-radius: 50%;
  top: -35px;
  left: 8px;
  border: 3px solid #111;
}

.punch {
  transform: scaleX(1.2);
}

.hit {
  animation: hit .2s;
}

@keyframes hit {
  50% {
    transform: translateX(-8px);
  }
}

#message {
  min-height: 30px;
  font-size: 20px;
  font-weight: bold;
}

.controls {
  width: 95%;
  max-width: 700px;
  margin: auto;
}

button {
  margin: 5px;
  padding: 14px 18px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  color: white;
}

.move {
  background: #555;
}

.attack {
  background: #ff8c00;
}

.block {
  background: #5555dd;
}

.special {
  background: #a020f0;
}

.restart {
  background: #20a050;
}

@media (max-width: 500px) {
  .arena {
    height: 350px;
  }

  button {
    padding: 12px 14px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<h1>⚔️ ARENA FIGHTER ⚔️</h1>

<div class="health-area">
  <div class="bar">
    <div id="playerHealth" class="fill"></div>
  </div>

  <div class="bar">
    <div id="enemyHealth" class="fill"></div>
  </div>
</div>

<div class="arena">

  <div id="player" class="fighter"></div>
  <div id="enemy" class="fighter"></div>

  <div class="ground"></div>

</div>

<div id="message">🔥 FIGHT!</div>

<div class="controls">

  <div>
    <button class="move" onclick="moveLeft()">⬅️ LEFT</button>
    <button class="move" onclick="moveRight()">RIGHT ➡️</button>
  </div>

  <div>
    <button class="attack" onclick="punch()">👊 PUNCH</button>
    <button class="attack" onclick="kick()">🦵 KICK</button>
  </div>

  <div>
    <button class="block" onclick="block()">🛡️ BLOCK</button>
    <button class="special" onclick="special()">⚡ SPECIAL</button>
  </div>

  <button class="restart" onclick="restart()">🔄 RESTART</button>

</div>

<script>

let playerHP = 100;
let enemyHP = 100;

let playerX = 80;
let enemyX = 80;

let blocking = false;
let gameOver = false;

const player = document.getElementById("player");
const enemy = document.getElementById("enemy");

function updateHealth() {

  document.getElementById("playerHealth").style.width =
    playerHP + "%";

  document.getElementById("enemyHealth").style.width =
    enemyHP + "%";
}

function message(text) {
  document.getElementById("message").innerText = text;
}

function moveLeft() {

  if (gameOver) return;

  playerX -= 25;

  if (playerX < 0)
    playerX = 0;

  player.style.left = playerX + "px";
}

function moveRight() {

  if (gameOver) return;

  playerX += 25;

  if (playerX > 330)
    playerX = 330;

  player.style.left = playerX + "px";
}

function punch() {

  if (gameOver) return;

  enemyHP -= 10;

  if (enemyHP < 0)
    enemyHP = 0;

  player.classList.add("punch");
  enemy.classList.add("hit");

  setTimeout(() => {
    player.classList.remove("punch");
    enemy.classList.remove("hit");
  }, 200);

  message("👊 PUNCH! -10");

  updateHealth();

  enemyTurn();
}

function kick() {

  if (gameOver) return;

  enemyHP -= 15;

  if (enemyHP < 0)
    enemyHP = 0;

  enemy.classList.add("hit");

  setTimeout(() => {
    enemy.classList.remove("hit");
  }, 200);

  message("🦵 KICK! -15");

  updateHealth();

  enemyTurn();
}

function block() {

  if (gameOver) return;

  blocking = true;

  message("🛡️ BLOCKING!");

  setTimeout(() => {
    blocking = false;
  }, 1000);
}

function special() {

  if (gameOver) return;

  let damage = Math.floor(Math.random() * 16) + 20;

  enemyHP -= damage;

  if (enemyHP < 0)
    enemyHP = 0;

  message("⚡ SPECIAL ATTACK! -" + damage);

  updateHealth();

  enemyTurn();
}

function enemyTurn() {

  if (enemyHP <= 0) {

    gameOver = true;
    message("🏆 YOU WIN!");
    return;
  }

  setTimeout(() => {

    let damage =
      Math.floor(Math.random() * 11) + 5;

    if (blocking) {

      damage = Math.floor(damage / 2);

      message("🛡️ BLOCKED! -" + damage);

    } else {

      message("💥 Enemy attacks! -" + damage);
    }

    playerHP -= damage;

    if (playerHP < 0)
      playerHP = 0;

    updateHealth();

    if (playerHP <= 0) {

      gameOver = true;
      message("💀 YOU LOSE!");
    }

  }, 500);
}

function restart() {

  playerHP = 100;
  enemyHP = 100;

  playerX = 80;

  blocking = false;
  gameOver = false;

  player.style.left = playerX + "px";

  updateHealth();

  message("🔥 FIGHT!");
}

updateHealth();

</script>

</body>
</html>
